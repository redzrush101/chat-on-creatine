<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat on Creatine Bridge</title>
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 260px; margin: 0; padding: 12px; color: #1d1d1f; background: #fff; }
    @media (prefers-color-scheme: dark) { body { color: #f5f5f7; background: #1c1c1e; } input, button { color: inherit; } }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .status { margin: 0 0 10px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #b0b0b0; }
    .dot.on { background: #34c759; }
    .error { color: #d70015; margin: 0 0 8px; min-height: 1em; }
    label { display: block; margin-bottom: 8px; }
    input { width: 100px; margin-left: 6px; }
    button { margin-right: 6px; }
  </style>
</head>
<body>
  <h1>Chat on Creatine Bridge</h1>
  <p class="status"><span id="dot" class="dot"></span><span id="state">Checking...</span></p>
  <p id="error" class="error"></p>
  <label>App port <input id="port" type="number" min="1024" max="65535"></label>
  <button id="save">Save port</button>
  <button id="repair">Re-pair</button>
  <script src="popup.js"></script>
</body>
</html>
